[package]
name = "rovyl"
version = "1.19.0"
edition = "2021"
rust-version = "1.80"
description = "Rovyl radial launcher — native Windows"
authors = ["HenryCa"]
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "rovyl"
path = "src/main.rs"

[dependencies]
# Named here, not only reached through `windows::core`: the `#[implement]` macro expands to
# crate-absolute `::windows_core::` paths, which only resolve if the crate is a dependency of
# this one. Same version as the `windows` crate re-exports, so there is one copy of the types.
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinHttp",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Foundation_Numerics",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
